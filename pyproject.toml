[project]
name = "meshssi"
version = "0.3.1"
description = "An irssi-style terminal client for MeshCore companion radios"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "meshcore>=2.3",
    "textual>=0.80",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
meshssi = "meshssi.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meshssi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
